<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 主播陪练</title>
<style>
  :root { --bg:#0f1420; --card:#1a2130; --line:#2a3346; --text:#e8ecf3; --dim:#9aa5b8; --accent:#4d7cff; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); }
  header { padding:16px 24px; border-bottom:1px solid var(--line); font-size:18px; font-weight:600; }
  header small { color:var(--dim); font-weight:400; margin-left:8px; }
  .wrap { max-width:960px; margin:0 auto; padding:24px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; margin-bottom:16px; }
  h2 { margin:0 0 16px; font-size:16px; }
  label { display:block; margin:12px 0 4px; color:var(--dim); font-size:13px; }
  input,select,textarea { width:100%; padding:10px; border-radius:8px; border:1px solid var(--line); background:#111827; color:var(--text); font-size:14px; }
  textarea { min-height:64px; resize:vertical; }
  button { padding:10px 18px; border:none; border-radius:8px; background:var(--accent); color:#fff; font-size:14px; cursor:pointer; }
  button.ghost { background:transparent; border:1px solid var(--line); color:var(--text); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .row { display:flex; gap:12px; flex-wrap:wrap; }
  video { width:100%; border-radius:8px; background:#000; }
  .bullets { max-height:260px; overflow-y:auto; border:1px solid var(--line); border-radius:8px; padding:12px; margin:12px 0; }
  .bullet { margin:6px 0; padding:8px 10px; border-radius:8px; background:#111827; }
  .bullet.fixed { border-left:3px solid #f5a623; }
  .bullet.dynamic { border-left:3px solid var(--accent); }
  .bullet .t { color:var(--dim); font-size:12px; margin-right:6px; }
  .issue { border:1px solid var(--line); border-radius:8px; padding:12px; margin:10px 0; }
  .issue .dim { display:inline-block; font-size:12px; padding:2px 8px; border-radius:10px; background:#1f2a44; color:#b8c7ff; }
  .issue .top { border-color:#f5a623; }
  .issue blockquote { margin:8px 0; padding:6px 10px; border-left:3px solid var(--dim); color:var(--dim); }
  .hint { color:var(--dim); font-size:13px; }
  .error { color:#ff7b7b; background:#2a1518; border:1px solid #5a2a30; padding:10px; border-radius:8px; margin:10px 0; }
  .ok { color:#7be3a3; }
  .status { font-size:14px; margin:8px 0; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<header>AI 主播陪练 <small>个人主播最小纵向切片 · 验收页</small></header>
<div class="wrap">

  <div id="view-create" class="card">
    <h2>创建练习</h2>
    <label>直播类型</label>
    <select id="f-type">
      <option value="带货">带货</option>
      <option value="娱乐互动">娱乐互动</option>
      <option value="知识内容">知识内容</option>
    </select>
    <label>训练目标（必填）</label>
    <input id="f-goal" placeholder="例如：练习开场留住观众、练习弹幕应答">
    <label>主题（可选）</label>
    <input id="f-topic" placeholder="例如：夏季护肤">
    <label>商品资料（可选，文本）</label>
    <textarea id="f-product" placeholder="商品名称、卖点、价格等，不填则 AI 不核验商品事实"></textarea>
    <label>脚本（可选，文本）</label>
    <textarea id="f-script" placeholder="自己准备的直播脚本"></textarea>
    <div class="row" style="margin-top:16px;">
      <button onclick="createTraining()">开始练习</button>
    </div>
    <div id="create-error" class="error" hidden></div>
  </div>

  <div id="view-practice" class="card" hidden>
    <h2>模拟直播</h2>
    <div class="hint" style="margin-bottom:8px;">模拟观众 · 不会真实开播</div>
    <video id="preview" autoplay muted playsinline></video>
    <div class="status">已练习 <span id="elapsed">0</span> 秒</div>
    <div id="bullets" class="bullets"></div>
    <div class="row">
      <button id="btn-end" onclick="endPractice()">结束练习</button>
    </div>
  </div>

  <div id="view-feedback" class="card" hidden>
    <h2>练后反馈</h2>
    <div id="fb-status" class="status">处理中…</div>
    <video id="fb-video" controls></video>
    <div id="fb-issues"></div>
    <div class="row" style="margin-top:12px;">
      <button onclick="doRetrain()">重练同一任务</button>
      <button class="ghost" onclick="showCompare(currentTraining.id)" id="btn-compare" hidden>对比上次</button>
      <button class="ghost" onclick="backToCreate()">返回</button>
    </div>
  </div>

  <div id="view-compare" class="card" hidden>
    <h2>前后对比</h2>
    <div id="cmp-body"></div>
    <div class="row" style="margin-top:12px;">
      <button class="ghost" onclick="backToCreate()">返回</button>
    </div>
  </div>

</div>

<script>
let currentTraining = null;
let currentScript = [];
let mediaStream = null, mediaRecorder = null, chunks = [];
let shownBullets = [];
let practiceStart = 0, timerId = null;

function showView(name) {
  ['create','practice','feedback','compare'].forEach(v =>
    document.getElementById('view-'+v).hidden = (v !== name));
}
function showError(elId, msg) {
  const el = document.getElementById(elId);
  el.textContent = msg; el.hidden = false;
}
function hideError(elId) { document.getElementById(elId).hidden = true; }

async function createTraining() {
  hideError('create-error');
  const payload = {
    live_type: document.getElementById('f-type').value,
    goal: document.getElementById('f-goal').value.trim(),
    topic: document.getElementById('f-topic').value.trim() || null,
    product_info: document.getElementById('f-product').value.trim() || null,
    script: document.getElementById('f-script').value.trim() || null,
  };
  if (!payload.goal) { showError('create-error', '请填写训练目标'); return; }
  const r = await fetch('/api/v1/trainings', {
    method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)
  });
  if (!r.ok) { const e = await r.json(); showError('create-error', e.error.message); return; }
  const data = await r.json();
  currentTraining = data.training;
  currentScript = data.script;
  await startPractice();
}

async function startPractice() {
  try {
    mediaStream = await navigator.mediaDevices.getUserMedia({ video:true, audio:true });
  } catch (err) {
    showError('create-error',
      '无法使用摄像头/麦克风。请检查：① 浏览器地址栏是否拦截了摄像头/麦克风权限并点"允许"；② 摄像头/麦克风是否被其他程序占用；③ 是否使用最新版 Chrome/Edge。');
    return;
  }
  document.getElementById('preview').srcObject = mediaStream;
  chunks = []; shownBullets = [];
  const mime = ['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm','video/mp4']
    .find(m => MediaRecorder.isTypeSupported(m));
  mediaRecorder = new MediaRecorder(mediaStream, mime ? {mimeType:mime} : undefined);
  mediaRecorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  mediaRecorder.start();
  practiceStart = Date.now();
  document.getElementById('bullets').innerHTML = '';
  document.getElementById('elapsed').textContent = '0';
  showView('practice');
  timerId = setInterval(tick, 500);
}

function tick() {
  const sec = Math.floor((Date.now() - practiceStart)/1000);
  document.getElementById('elapsed').textContent = sec;
  currentScript.filter(b => b.at_sec <= sec && !shownBullets.includes(b)).forEach(b => {
    shownBullets.push(b);
    const div = document.createElement('div');
    div.className = 'bullet ' + (b.kind === 'fixed_question' ? 'fixed' : 'dynamic');
    div.innerHTML = '<span class="t">'+sec+'s</span>' +
      (b.scenario_id ? '<span class="t hint">训练场景</span>' : '') +
      escapeHtml(b.text);
    document.getElementById('bullets').appendChild(div);
    document.getElementById('bullets').scrollTop = 99999;
  });
}

function endPractice() {
  clearInterval(timerId);
  mediaRecorder.stop();
  mediaRecorder.onstop = async () => {
    const blob = new Blob(chunks, { type: mediaRecorder.mimeType || 'video/webm' });
    const duration = Math.round((Date.now() - practiceStart)/1000);
    stopMedia();
    const fd = new FormData();
    fd.append('file', blob, 'recording.webm');
    fd.append('duration_sec', String(duration));
    fd.append('bullets', JSON.stringify(shownBullets.map(b => ({
      at_sec:b.at_sec, kind:b.kind, text:b.text,
      scenario_id:b.scenario_id, viewer_intent:b.viewer_intent,
      sample_type:b.sample_type, difficulty:b.difficulty,
      must_cover:b.must_cover, failure_signals:b.failure_signals, source_refs:b.source_refs
    }))));
    const r = await fetch('/api/v1/trainings/'+currentTraining.id+'/finish', { method:'POST', body: fd });
    if (!r.ok) { const e = await r.json(); alert(e.error.message); return; }
    const data = await r.json();
    currentTraining = data.training;
    showView('feedback');
    document.getElementById('fb-video').src = '/api/v1/trainings/'+currentTraining.id+'/recording';
    pollFeedback(currentTraining.id);
  };
}

function stopMedia() {
  if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
  mediaStream = null;
}

async function pollFeedback(id) {
  const r = await fetch('/api/v1/trainings/'+id+'/feedback');
  const data = await r.json();
  const st = data.status;
  const statusEl = document.getElementById('fb-status');
  if (st === 'transcribing') statusEl.textContent = '正在转写录像…';
  else if (st === 'analyzing') statusEl.textContent = '正在生成反馈…';
  else if (st === 'feedback_ready') { statusEl.textContent = ''; renderFeedback(data.feedback); return; }
  else if (st === 'failed') { statusEl.innerHTML = '<span class="error">分析失败，可返回重试</span>'; return; }
  else statusEl.textContent = '处理中…';
  setTimeout(() => pollFeedback(id), 1500);
}

function renderFeedback(fb) {
  if (!fb || !fb.issues.length) { document.getElementById('fb-issues').innerHTML = '<div class="hint">暂无反馈</div>'; return; }
  const top = new Set(fb.top_issue_ids || []);
  document.getElementById('fb-issues').innerHTML = fb.issues.map((it, i) => {
    const isTop = top.has(i);
    return '<div class="issue'+(isTop?' top':'')+'">'+
      '<span class="dim">'+escapeHtml(it.dimension)+'</span> '+(isTop?'<span class="hint">★ 优先改进</span>':'')+
      '<div class="t hint">时间 '+fmt(it.start_sec)+'–'+fmt(it.end_sec)+' · <a href="#" onclick="jump('+it.start_sec+');return false;">跳到片段</a></div>'+
      (it.evidence ? '<blockquote>'+escapeHtml(it.evidence)+'</blockquote>' : '')+
      '<div><b>问题：</b>'+escapeHtml(it.problem)+'</div>'+
      (it.suggestion ? '<div><b>建议：</b>'+escapeHtml(it.suggestion)+'</div>' : '')+
      (it.retrain_target ? '<div><b>可重练：</b>'+escapeHtml(it.retrain_target)+'</div>' : '')+
      '</div>';
  }).join('');
  if (currentTraining.prev_training_id) document.getElementById('btn-compare').hidden = false;
}

function jump(sec) {
  const v = document.getElementById('fb-video');
  v.currentTime = Math.max(0, sec - 1); v.play();
}
function fmt(s) { return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'); }

async function doRetrain() {
  const r = await fetch('/api/v1/trainings/'+currentTraining.id+'/retrain', { method:'POST' });
  if (!r.ok) { const e = await r.json(); alert(e.error.message); return; }
  const data = await r.json();
  currentTraining = data.training;
  currentScript = data.script;
  document.getElementById('btn-compare').hidden = true;
  await startPractice();
}

async function showCompare(id) {
  const r = await fetch('/api/v1/trainings/'+id+'/compare');
  if (!r.ok) { const e = await r.json(); alert(e.error.message); return; }
  const data = await r.json();
  document.getElementById('cmp-body').innerHTML = side('本次', data.current) + side('上次', data.previous);
  showView('compare');
}
function side(title, s) {
  const issues = (s.issues||[]).map(it =>
    '<div class="issue"><span class="dim">'+escapeHtml(it.dimension)+'</span> '+
    '<div class="t hint">'+fmt(it.start_sec)+'–'+fmt(it.end_sec)+'</div>'+
    '<blockquote>'+escapeHtml(it.evidence||'')+'</blockquote>'+
    '<div>'+escapeHtml(it.problem||'')+'</div></div>').join('') || '<div class="hint">无反馈</div>';
  return '<div class="card"><h2>'+title+'（'+s.training.goal+'）</h2>'+issues+'</div>';
}

function backToCreate() {
  stopMedia(); clearInterval(timerId);
  showView('create');
}

function escapeHtml(s) {
  return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
</script>
</body>
</html>
